# GitHub Actions CI/CD Pipeline
# Automated testing, security scanning, and deployment

name: Mental Wellness AI - CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

# Least privilege by default. A job that needs more asks for it itself.
permissions:
  contents: read

env:
  NODE_VERSION: '22.x'
  PYTHON_VERSION: '3.11'
  DOCKER_REGISTRY: ghcr.io
  IMAGE_NAME: mental-wellness-ai

jobs:
  # Security and Code Quality Checks
  security-scan:
    name: Security & Code Quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Without this the SARIF upload fails wherever the default token is
      # read-only, taking the whole pipeline down with it.
      security-events: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'mental-wellness-ai'
          path: '.'
          format: 'JSON'
          args: >
            --enableRetired
            --enableExperimental
            --out reports

      - name: HIPAA Compliance Check
        run: |
          echo "Checking for hardcoded secrets..."
          # Looks for a secret being *assigned a literal value*, not for the
          # word "key". The previous pattern was password|secret|key across
          # every .js and .py file, which matches apiKey, publicKey, keys()
          # and so on — it could never pass, and since every other job needs
          # this one, nothing in this pipeline could ever run.
          if grep -rInE \
               '(password|passwd|secret|api_?key|access_?token|private_?key)["'"'"']?[[:space:]]*[:=][[:space:]]*["'"'"'][^"'"'"']{8,}["'"'"']' \
               --include='*.js' --include='*.ts' --include='*.py' \
               --exclude-dir=node_modules --exclude-dir=.git \
               --exclude-dir=test --exclude-dir=tests --exclude-dir=__tests__ --exclude-dir=e2e \
               --exclude='test_*' --exclude='*_test.*' --exclude='*Test.*' \
               --exclude='*.example.*' --exclude='*.test.*' --exclude='*.spec.*' . ; then
            echo "::error::Hardcoded secret assignments found (listed above)."
            exit 1
          fi
          echo "No hardcoded secret assignments detected."
  # Backend Testing
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: security-scan
    
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      # backend/eslint.config.js: @eslint/js recommended, Node and Jest globals. Fatal.
      - name: Run ESLint
        working-directory: ./backend
        run: npm run lint

      - name: Run Unit Tests
        working-directory: ./backend
        env:
          NODE_ENV: test
          DATABASE_PATH: ./test.db
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret-key
        run: |
          # The safety suites must be found and run: a green tick with nothing run would
          # hide a broken crisis gate. jest fails on its own if a suite fails.
          for suite in test/safety.test.js test/safetyLayers.test.js test/crisisGate.test.js; do
            npx jest --listTests | grep -q "${suite}$" || { echo "::error::jest does not see ${suite}"; exit 1; }
          done
          npm test -- --coverage

      - name: Run Integration Tests
        working-directory: ./backend
        env:
          NODE_ENV: test
          DATABASE_PATH: ./test_integration.db
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret-key
        # There is no test:integration script in this package; --if-present
        # skips it rather than failing on a script that was never written.
        run: npm run test:integration --if-present

      - name: Upload Coverage Reports
        uses: codecov/codecov-action@v7
        with:
          files: ./backend/coverage/lcov.info
          flags: backend
          name: backend-coverage

  # Frontend Testing
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: security-scan

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Typecheck
        working-directory: ./frontend
        run: npm run typecheck

      - name: Unit Tests (crisis screen)
        working-directory: ./frontend
        run: npm test

      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build

      - name: Browser tests (Playwright + axe at 375, 768 and 1280 px)
        working-directory: ./frontend
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

  # Build and Push Docker Images
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    # Publishing and deploying are opt-in. This pipeline had never run: it
    # lived in devops/.github/workflows/, which GitHub does not look in.
    # Moving it to the root switched it on, and these jobs push images to
    # ghcr.io and SSH into servers to redeploy — so they stay off until the
    # ENABLE_DEPLOY repository variable is set to true.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_DEPLOY == 'true'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Backend Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}-backend
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploy to Production
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && vars.ENABLE_DEPLOY == 'true'
    environment: production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Deploy to Production Server
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USERNAME }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: ${{ secrets.PRODUCTION_PORT }}
          script: |
            cd /opt/mental-wellness-ai
            git pull origin main
            docker-compose -f devops/docker-compose.prod.yml pull
            docker-compose -f devops/docker-compose.prod.yml up -d --no-deps backend
            sleep 30
            docker-compose -f devops/docker-compose.prod.yml restart nginx
            docker system prune -f

      - name: Production Health Check
        run: |
          sleep 60
          curl -f ${{ secrets.PRODUCTION_URL }}/health || exit 1
          echo "✅ Production deployment successful"

      - name: Smoke Tests
        working-directory: ./tests
        env:
          TEST_URL: ${{ secrets.PRODUCTION_URL }}
        run: |
          npm ci
          npm run test:smoke

  # Notification
  notify:
    name: Deployment Notification
    runs-on: ubuntu-latest
    needs: [deploy-production]
    if: always() && github.ref == 'refs/heads/main' && vars.ENABLE_DEPLOY == 'true'

    steps:
      - name: Notify Team
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          channel: '#mental-wellness-deployments'
          text: |
            🚀 Production Deployment Complete
            Repository: ${{ github.repository }}
            Commit: ${{ github.sha }}
            Status: ${{ job.status }}
            
            ✅ Backend API deployed
            ✅ HIPAA compliance verified
            ✅ Security scans passed
            ✅ Backups verified
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}